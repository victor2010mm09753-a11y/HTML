<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

    <h1>Formulário</h1>

    <form>
<fieldset>
        <legend>Dados pessoais</legend>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">
        <br><br>

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco">
        <br><br>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade">
        <br><br>

        <label for="estado">Estado:</label>
        <select id="estado" name="estado">
            <option>São Paulo</option>
            <option>Rio de Janeiro</option>
            <option>Minas Gerais</option>
            <option>Ceará</option>
        </select>

        <br><br>
</fieldset>
<br>
<fieldset>
        <legend>Dados profissionais</legend>

        <label>Natureza do Cargo:</label>
        <br>

        <input type="radio" name="curso">Gerência
        
        <input type="radio" name="curso">Financeiro

        <input type="radio" name="curso">Recepção

        <input type="radio" name="curso">Administrativo

        <input type="radio" name="curso">Jurídico
        <br><br>

        <label>Área de atuação:</label>
        <br>

        <input type="checkbox" nome="area">Computação

        <input type="checkbox" nome="area">Biologia

        <input type="checkbox" nome="area">Meio Ambiente

        <input type="checkbox" nome="area">Engenharia

        <input type="checkbox" nome="area">História

        <br><br>
        Mini-currículo:
        <textarea id="mensagem" name="mensagem" rows="9" cols="90"></textarea>
        <br>

    </fieldset>
        <br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>

</body>
</html>
